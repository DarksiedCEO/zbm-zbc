name: debug-clipper-macos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clipper-macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: python -m pip install -r services/clipper-network-py/requirements.txt
      - name: Test and surface failures as annotations
        working-directory: services/clipper-network-py
        run: |
          set +e
          python -m pytest -q -rfE -p no:cacheprovider > ../../pytest-out.txt 2>&1
          code=$?
          tail -5 ../../pytest-out.txt
          grep -E "^(FAILED|ERROR) " ../../pytest-out.txt | head -20 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          grep -nE "^E  " ../../pytest-out.txt | head -20 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          exit $code
