# zbm-zbc continuous integration.
#
# One job per service (the fourteen pip-managed Python services share one matrix definition and report as separate
# checks, e.g. "python-tests (finance-py, 3.13)"), the uv-managed delivery-py, ledger-rust, orchestrator-go, the
# dashboard, the ten self-contained live runs (real ledger-rust binary over real HTTP), the Docker live proof for
# delivery-py, dependency and secret scans, and one `required` job that needs every other job so branch protection
# has a single check to require. See docs/ci.md for what each job proves and what is deliberately not here yet.
#
# Every third-party action is pinned to a commit SHA (the tag it corresponds to is in the trailing comment). The
# SHAs were resolved with `git ls-remote --tags` against github.com on 2026-09-27.
#
# macOS (fix wave 21, founder: the Mac checks run without him): every Python service, delivery-py, ledger-rust and
# orchestrator-go also run on `macos-26` (GitHub's Apple Silicon runner, arm64), one Python version (3.13) for the
# Python services; the results feed the same `required` job. GitHub's macOS runners have no Docker, so the
# delivery-docker-live job stays Linux-only (delivery-py's Docker live module skips on macOS with its printed reason).
# Fix wave 25 (scout C3-2): was `macos-14`, which GitHub's runner-images README marks deprecated ("will be fully
# unsupported by November 2nd", actions/runner-images#13518); `macos-26` is the GA arm64 image `macos-latest` points
# to (README read 2026-10-01; docs/ci.md quotes it).
#
# Hygiene (fix wave 25, founder ruling R-HYGIENE): every suite runs under `devtools/hygiene_check.py run`, which fails
# the job when the suite changes a tracked file, leaves a new git-ignored file, leaves anything in its private TMPDIR
# or /tmp, leaves a process running, skips a test for a reason not on the suite's expected list, or runs a number of
# tests different from docs/test-counts.md. The `hygiene-static` job runs the static rules over the whole tree.
#
# Path filtering is done by the `changes` job (a plain `git diff`, no third-party action) so an unrelated change
# does not run every suite. Shared files (root README.md, docs/**, fixtures/**, devtools/**, .github/**) run
# everything. The fifteen Python services are one cluster: their tests read each other's sources (ports.py,
# requirements.txt, api.py, ledger-rust's server.rs), so a change to any of them, or to ledger-rust, runs all of
# them. A path no rule knows about runs everything (fail safe).

name: CI

on:
  push:
    branches:
      - main
      - "integration-**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on pull requests only; every push to main / integration-* runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------------------------------------------
  # Which parts of the tree changed. Outputs are "true"/"false". Anything that is not a pull request with a
  # resolvable base, or a push with a known previous commit, runs everything.
  # ---------------------------------------------------------------------------------------------------------------
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          run_all=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_all=true
          elif [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            run_all=true   # first push of a branch, or a force push: no reliable base
          elif ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            run_all=true   # base commit is not in this clone (rewritten history)
          fi
          if [ "$run_all" = true ]; then
            echo "no reliable base commit; running every job"
            printf 'python=true\nrust=true\ngo=true\ndashboard=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          echo "changed files:"; sed 's/^/  /' "$RUNNER_TEMP/changed.txt"
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import re
          import os
          changed = [l.strip() for l in open(os.path.join(os.environ["RUNNER_TEMP"], "changed.txt")) if l.strip()]
          # Shared inputs: anything here runs every suite (devtools/: the hygiene check every suite runs under).
          shared_files = {"README.md", ".gitleaks.toml", ".gitignore"}
          shared_dirs = ("docs/", "fixtures/", ".github/", "devtools/")
          groups = {"python": False, "rust": False, "go": False, "dashboard": False}
          py_re = re.compile(r"^services/[a-z0-9-]+-py/")
          for f in changed:
              if f in shared_files or f.startswith(shared_dirs):
                  groups = {k: True for k in groups}
                  break
              if py_re.match(f):
                  groups["python"] = True
              elif f.startswith("services/ledger-rust/"):
                  groups["python"] = True   # onboarding-py builds it; creative-py reads src/bin/server.rs
                  groups["rust"] = True
              elif f.startswith("services/orchestrator-go/"):
                  groups["go"] = True
              elif f.startswith("apps/dashboard-ts/"):
                  groups["dashboard"] = True
              else:
                  groups = {k: True for k in groups}   # unknown path: fail safe, run everything
                  break
          for k, v in groups.items():
              print(f"{k}={'true' if v else 'false'}")
          EOF
          echo "outputs:"; tail -n 4 "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------------------------------
  # Python services managed by requirements.txt. Each entry: `cd services/<svc> && python -m pytest -q -rs`
  # (root README "Testing": use `python -m pytest`, never the bare `pytest` binary), under the hygiene check.
  # onboarding-py's live tests build ledger-rust with `cargo build --release --bin server` from inside the suite, so
  # that entry gets Rust (and may create services/ledger-rust/target, the one ignored path it is allowed to make).
  # ---------------------------------------------------------------------------------------------------------------
  python-tests:
    name: python-tests (${{ matrix.service }}, ${{ matrix.python }}, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.12", "3.13"]
        service:
          - detection-py
          - fulfillment-py
          - onboarding-py
          - creative-py
          - compliance-py
          - verification-py
          - clipper-network-py
          - finance-py
          - legal-py
          - security-py
          - sales-py
          - service-py
          - influencer-py
          - bizdev-py
          - seo-py
        # macOS (Apple Silicon): every service once, on Python 3.13
        include:
          - {os: macos-26, python: "3.13", service: detection-py}
          - {os: macos-26, python: "3.13", service: fulfillment-py}
          - {os: macos-26, python: "3.13", service: onboarding-py}
          - {os: macos-26, python: "3.13", service: creative-py}
          - {os: macos-26, python: "3.13", service: compliance-py}
          - {os: macos-26, python: "3.13", service: verification-py}
          - {os: macos-26, python: "3.13", service: clipper-network-py}
          - {os: macos-26, python: "3.13", service: finance-py}
          - {os: macos-26, python: "3.13", service: legal-py}
          - {os: macos-26, python: "3.13", service: security-py}
          - {os: macos-26, python: "3.13", service: sales-py}
          - {os: macos-26, python: "3.13", service: service-py}
          - {os: macos-26, python: "3.13", service: influencer-py}
          - {os: macos-26, python: "3.13", service: bizdev-py}
          - {os: macos-26, python: "3.13", service: seo-py}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Rust toolchain (onboarding-py builds ledger-rust inside its suite)
        if: matrix.service == 'onboarding-py'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.service == 'onboarding-py'
        with:
          workspaces: services/ledger-rust -> target
      - name: Install pinned requirements
        run: python -m pip install -r services/${{ matrix.service }}/requirements.txt
      - name: Test (under the hygiene check)
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          python devtools/hygiene_check.py run --suite "python:$SERVICE" --kind pytest --cwd "services/$SERVICE" \
            --allow-ignored services/ledger-rust/target \
            -- python -m pytest -q -rs -p no:cacheprovider

  # ---------------------------------------------------------------------------------------------------------------
  # delivery-py is uv-managed: `uv sync --frozen` (the dev group holds pytest; the READMEs' `--no-dev` leaves no
  # pytest in the venv), then `.venv/bin/python -m pytest -q` and `ruff check src tests devtools`. The Docker
  # live module skips here with its printed reason; the delivery-docker-live job below is where it must run.
  # tests/test_toolchains.py drives the REAL go, cargo and node toolchains on the toy fixtures (ADR 0011 toolchain
  # amendment): Rust stable, Go (version from fixtures/dlv/toy-go/go.mod) and Node 22 are installed first, so those
  # tests run instead of failing on a missing binary.
  # ---------------------------------------------------------------------------------------------------------------
  delivery-py:
    name: delivery-py (${{ matrix.python }}, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    # fix wave 26b (CI #4): the suite's test step took 53-56 min on ubuntu-24.04 and was cancelled at 59% by the
    # 60-min limit on macos-26 (no failure up to there); the limit is a hang guard, not a speed bound
    # RT2-3 (AEGIS r26b): the macos-26 leg's pace varied 1.8x across CI #4-#6 and CI #4's pace projects to 115-132
    # min for the full suite, so macos-26 gets 180; ubuntu (50-56 min, stable) keeps 120
    timeout-minutes: ${{ matrix.os == 'macos-26' && 180 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.12", "3.13"]
        include:
          # macOS (Apple Silicon): no Docker on the runner — tests/test_live_docker.py skips with its reason here
          # and must run in delivery-docker-live (Linux) instead
          - {os: macos-26, python: "3.13"}
    defaults:
      run:
        working-directory: services/delivery-py
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"   # the toy-ts fixture runs .ts files under `node --test`; needs Node 22.18+ type stripping
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: fixtures/dlv/toy-go/go.mod
          cache: false   # the fixture has no go.sum (no module dependencies); nothing to key a cache on
      - name: Rust stable (the toy-rs fixture is built with cargo test --locked --offline)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version && go version && node --version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.8.17"   # the version uv.lock was produced with (services/delivery-py/docker/Dockerfile)
          enable-cache: true
          cache-dependency-glob: services/delivery-py/uv.lock
      - name: Sync the locked environment
        run: uv sync --frozen --python ${{ matrix.python }}
      - name: Lint
        run: uvx ruff@0.15.11 check src tests devtools
      - name: Test (under the hygiene check)
        working-directory: .
        run: |
          python devtools/hygiene_check.py run --suite python:delivery-py --kind pytest --cwd services/delivery-py \
            --allow-ignored services/delivery-py/.venv \
            -- "$GITHUB_WORKSPACE/services/delivery-py/.venv/bin/python" -m pytest -q -rs -p no:cacheprovider

  # ---------------------------------------------------------------------------------------------------------------
  # ledger-rust: root README "Testing" — `cargo test` (unit tests plus integration tests that spawn the compiled
  # binary over a real TCP socket; counts in docs/test-counts.md) and `cargo clippy --all-targets -- -D warnings`.
  # `--locked` refuses a Cargo.lock drift.
  # ---------------------------------------------------------------------------------------------------------------
  ledger-rust:
    name: ledger-rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    defaults:
      run:
        working-directory: services/ledger-rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Rust stable with clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          cargo --version && cargo clippy --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: services/ledger-rust -> target
      - name: Test (under the hygiene check)
        working-directory: .
        run: |
          python3 devtools/hygiene_check.py run --suite rust:ledger-rust --kind cargo --cwd services/ledger-rust \
            --allow-ignored services/ledger-rust/target -- cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  # ---------------------------------------------------------------------------------------------------------------
  # orchestrator-go: root README "Testing" — `go vet ./... && go test -count=1 ./...`, with the race detector on.
  # ---------------------------------------------------------------------------------------------------------------
  orchestrator-go:
    name: orchestrator-go (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    defaults:
      run:
        working-directory: services/orchestrator-go
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/orchestrator-go/go.mod
          cache: false   # no go.sum (no module dependencies); nothing to key a cache on
      - name: Vet
        run: go vet ./...
      - name: Test (race detector, under the hygiene check; -v so every test and skip is counted)
        working-directory: .
        env:
          GOTELEMETRY: "off"
        run: |
          python3 devtools/hygiene_check.py run --suite go:orchestrator-go --kind go --cwd services/orchestrator-go \
            -- go test -race -count=1 -v ./...

  # ---------------------------------------------------------------------------------------------------------------
  # Dashboard: root README "Testing" — `npm ci && npm run lint (tsc --noEmit) && npm run build && npm test` (the
  # live tests start the built server, so build comes first), plus the package's own `check:dynamic` script.
  # `npm audit` is in the audit-node job. A skipped test fails the job (the live tests skip without a build).
  # ---------------------------------------------------------------------------------------------------------------
  dashboard-ts:
    name: dashboard-ts
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # npm (10.x) turns on Node's module compile cache in $TMPDIR/node-compile-cache for every `npm run`; under the
      # hygiene wrapper that directory is a leftover in the suite's private TMPDIR (rule R3, seen in fix wave 25)
      NODE_DISABLE_COMPILE_CACHE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: apps/dashboard-ts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"   # `npm test` runs .ts files under `node --test`; needs Node 22.18+ type stripping
          cache: npm
          cache-dependency-path: apps/dashboard-ts/package-lock.json
      - name: Install (clean, from the lockfile)
        run: npm ci
      - name: Typecheck (npm run lint = tsc --noEmit)
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test (under the hygiene check)
        working-directory: .
        run: python3 devtools/hygiene_check.py run --suite node:dashboard-ts --kind node --cwd apps/dashboard-ts -- npm test
      - name: Dynamic-route check
        run: npm run check:dynamic

  # ---------------------------------------------------------------------------------------------------------------
  # Live runs: each department's own `devtools/live_run.py` — the REAL ledger-rust binary and the department's
  # production entrypoint as separate processes over real HTTP, every narrated behaviour asserted, exit 0 only when
  # the ledger(s) verify valid (GET /ledger/verify) and every check held. These are the integration runs the
  # department READMEs describe. There is no script for the Revenue Recovery three-process run
  # (ledger + detection + orchestrator) described in the root README, so that one is not here — see docs/ci.md.
  # ---------------------------------------------------------------------------------------------------------------
  live-runs:
    name: live-run (${{ matrix.service }}, ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        service: [compliance-py, verification-py, clipper-network-py, finance-py, legal-py, security-py, sales-py, service-py, influencer-py, bizdev-py]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: services/ledger-rust -> target
      - name: Build the real ledger-rust server
        working-directory: services/ledger-rust
        run: cargo build --locked --release --bin server
      - name: Install pinned requirements
        # verification-py's live run also starts compliance-py's production entrypoint; the pins are identical
        # today, and installing both keeps that true by construction.
        run: |
          python -m pip install -r services/${{ matrix.service }}/requirements.txt
          if [ "${{ matrix.service }}" = "verification-py" ]; then
            python -m pip install -r services/compliance-py/requirements.txt
          fi
      # Scout C6-2 (fix wave 25; fix wave 26b): a live_run.py removes its mkdtemp work dir (ledger logs, service
      # logs — the run's evidence) when the run ends, unless LIVE_WORK_DIR names a directory to keep it in (every
      # live_run.py reads that name since wave 26b; finance-py's old FIN_LIVE_WORKDIR still works, with a deprecation
      # notice). The job keeps it in $RUNNER_TEMP/live-work, outside the hygiene wrapper's private TMPDIR, so it is
      # requested output, not a leftover; the next step prints what it holds and removes it. A temp file or process
      # the run leaves anywhere else still fails the wrapper (R3/R4).
      - name: Live run (under the hygiene check; no temp file or process may outlive it)
        env:
          LEDGER_BIN: ${{ github.workspace }}/services/ledger-rust/target/release/server
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p "$RUNNER_TEMP/live-work"
          LIVE_WORK_DIR="$RUNNER_TEMP/live-work" \
            python devtools/hygiene_check.py run --suite "live:$SERVICE" --kind none --cwd "services/$SERVICE" \
            -- python devtools/live_run.py
      - name: Live-run work dir (listed as evidence in this log, then removed)
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/live-work" ]; then
            find "$RUNNER_TEMP/live-work" -maxdepth 2 | sort
            rm -rf "$RUNNER_TEMP/live-work"
          fi

  # ---------------------------------------------------------------------------------------------------------------
  # delivery-py's Docker live proof (tests/test_live_docker.py): the properties only a machine with a Docker daemon
  # can prove (uid 65532, seccomp on, --network none with no egress client, read-only root, deadline kill, volume
  # reaped). The test skips with a printed reason when it cannot run; this job FAILS if any of its tests skipped.
  #
  # The test wants DLV_LIVE_SANDBOX_IMAGE=<registry-host>/<path>@sha256:<digest> (a digest-pinned image; a tag-only
  # reference is refused by the adapter, ST-03) and derives DLV_IMAGE_REGISTRY from the host. A locally built image
  # has no repository digest, so the image is pushed to a registry container on 127.0.0.1:5000 and referenced by
  # the digest that push produces. docker/sandbox.Dockerfile has two build arguments without a default, both passed
  # below: BASE_DIGEST (python:3.12-slim) and NODE_SHA256 (the Node tarball's sha256; CI #2 failed for lack of it,
  # fix wave 26a W26-3 — devtools/test_ci_docker_args.py in hygiene-static now checks every such argument is
  # passed). ADR 0011's "Pinned hashes" records both values (RECORDED_BASE_DIGEST / NODE_SHA256 here must equal it).
  # The base digest the build USES is the repository variable DLV_SANDBOX_BASE_DIGEST (64 hex); while it is unset
  # this job resolves the CURRENT digest of python:3.12-slim, compares it with the recorded one and warns (an
  # unpinned float, stated plainly in docs/ci.md).
  # ---------------------------------------------------------------------------------------------------------------
  delivery-docker-live:
    name: delivery-docker-live
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SANDBOX_TAG: 127.0.0.1:5000/zbm/dlv-sandbox:ci
      # python:3.12-slim image index digest recorded in ADR 0011 on 2026-10-02 (= the one CI #2 resolved)
      RECORDED_BASE_DIGEST: "dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016"
      # sha256 of node-v22.22.2-linux-x64.tar.xz, from the Node.js SHASUMS256.txt for v22.22.2 (ADR 0011)
      NODE_VERSION: "22.22.2"
      NODE_SHA256: "88fd1ce767091fd8d4a99fdb2356e98c819f93f3b1f8663853a2dee9b438068a"
      # fix wave 26b (W26-3b): the Go tarball and the rustup installer, pinned like Node (ADR 0011 "Pinned hashes");
      # the sandbox's Rust toolchain is a concrete version
      GO_VERSION: "1.23.1"
      GO_SHA256: "49bbb517cfa9eee677e1e7897f7cf9cfdbcf49e05f61984a2789136de359f9bd"
      RUSTUP_VERSION: "1.29.1"
      RUSTUP_INIT_SHA256: "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
      RUST_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Docker daemon present
        run: docker info --format '{{.ServerVersion}}'
      - name: Resolve the python:3.12-slim base digest
        id: base
        env:
          PINNED: ${{ vars.DLV_SANDBOX_BASE_DIGEST }}
        run: |
          set -euo pipefail
          # fix wave 26b (R26-4): the build ALWAYS uses the digest ADR 0011 records; the repository variable, when set,
          # must equal it (it was used unchecked, and without it the build took whatever python:3.12-slim was current)
          digest="$RECORDED_BASE_DIGEST"
          echo "$digest" | grep -Eq '^[0-9a-f]{64}$' || { echo "RECORDED_BASE_DIGEST is not 64 hex: $digest"; exit 1; }
          if [ -n "$PINNED" ] && [ "$PINNED" != "$digest" ]; then
            echo "DLV_SANDBOX_BASE_DIGEST ($PINNED) differs from the digest ADR 0011 records ($digest)"; exit 1
          fi
          current=$(docker buildx imagetools inspect python:3.12-slim --format '{{.Manifest.Digest}}' 2>/dev/null | sed 's/^sha256://' || true)
          if [ -n "$current" ] && [ "$current" != "$digest" ]; then
            echo "::notice title=base image moved::python:3.12-slim is now sha256:$current; the build uses the recorded sha256:$digest (re-record in ADR 0011 to move)"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Local registry (so the image gets a repository digest)
        run: |
          docker run -d --name ci-registry -p 127.0.0.1:5000:5000 registry:2
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:5000/v2/
      - name: Build the sandbox image
        env:
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          set -euo pipefail
          docker build -f services/delivery-py/docker/sandbox.Dockerfile \
            --build-arg BASE_DIGEST="$BASE_DIGEST" --build-arg NODE_VERSION="$NODE_VERSION" \
            --build-arg NODE_SHA256="$NODE_SHA256" --build-arg GO_VERSION="$GO_VERSION" \
            --build-arg GO_SHA256="$GO_SHA256" --build-arg RUSTUP_VERSION="$RUSTUP_VERSION" \
            --build-arg RUSTUP_INIT_SHA256="$RUSTUP_INIT_SHA256" --build-arg RUST_TOOLCHAIN="$RUST_TOOLCHAIN" \
            -t "$SANDBOX_TAG" .
      - name: Push and pin by digest
        id: image
        run: |
          set -euo pipefail
          docker push "$SANDBOX_TAG"
          ref=$(docker image inspect "$SANDBOX_TAG" --format '{{index .RepoDigests 0}}')
          echo "$ref" | grep -Eq '^127\.0\.0\.1:5000/zbm/dlv-sandbox@sha256:[0-9a-f]{64}$' || { echo "unexpected digest reference: $ref"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "sandbox image: $ref"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: services/delivery-py/uv.lock
      - name: Sync the locked environment
        working-directory: services/delivery-py
        run: uv sync --frozen --python 3.12
      - name: Run the Docker live tests
        working-directory: services/delivery-py
        env:
          DLV_LIVE_SANDBOX_IMAGE: ${{ steps.image.outputs.ref }}
        run: .venv/bin/python -m pytest -q -rs -p no:cacheprovider tests/test_live_docker.py --junitxml="$RUNNER_TEMP/live-docker.xml"
      - name: Fail if any Docker live test was skipped
        run: |
          python3 - <<'EOF'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "live-docker.xml")).getroot()
          cases = list(root.iter("testcase"))
          skipped = [c.get("name") for c in cases if c.find("skipped") is not None]
          print(f"{len(cases)} test cases, {len(skipped)} skipped")
          assert cases, "no test cases collected from tests/test_live_docker.py"
          assert not skipped, f"Docker live tests skipped (must run here): {skipped}"
          EOF
      - name: Registry teardown
        if: always()
        run: docker rm -f ci-registry >/dev/null 2>&1 || true

  # ---------------------------------------------------------------------------------------------------------------
  # Dependency audits. Always run (they are cheap next to the suites and a lockfile change anywhere matters).
  # ---------------------------------------------------------------------------------------------------------------
  audit-python:
    name: audit-python (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.8.17"
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      - name: pip-audit every requirements.txt
        run: |
          set -euo pipefail
          for req in services/*-py/requirements.txt; do
            echo "== $req"
            pip-audit -r "$req" --strict --progress-spinner off
          done
      - name: pip-audit delivery-py's uv.lock
        # The two deer-flow packages are git-sourced (pinned to a commit) and have no registry version to look up;
        # pip-audit refuses URL requirements, so they are excluded here and stated in docs/ci.md.
        working-directory: services/delivery-py
        run: |
          set -euo pipefail
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/dlv-lock.txt"
          grep -v '@ git+' "$RUNNER_TEMP/dlv-lock.txt" > "$RUNNER_TEMP/dlv-registry.txt"
          echo "excluded (git-sourced):"; grep '@ git+' "$RUNNER_TEMP/dlv-lock.txt" || true
          pip-audit -r "$RUNNER_TEMP/dlv-registry.txt" --no-deps --disable-pip --strict --progress-spinner off

  audit-rust:
    name: audit-rust (cargo audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ledger-rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: services/ledger-rust -> target
          cache-all-crates: true   # keeps the installed cargo-audit binary between runs
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: cargo audit
        run: cargo audit

  audit-node:
    name: audit-node (npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dashboard-ts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - name: npm audit (high and above fail)
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------------------------------------------
  # Secret scan over the whole git history with the gitleaks release binary (checksum-verified download; no
  # third-party action, no licence key). .gitleaks.toml allowlists exact fake strings only: four used by
  # onboarding-py's redaction tests, two fake Stripe test-key shapes used by finance-py's simulated Stripe, the
  # retired test-only PII hash key still in sales-py's history (replaced in 6072160), and the fake tax id still in
  # bizdev-py's history (tests/test_aegis_r1.py in 22fe413).
  # ---------------------------------------------------------------------------------------------------------------
  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb   # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-verified release binary)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      - name: Scan the full history
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git --no-banner --redact --exit-code 1 --config .gitleaks.toml .

  # ---------------------------------------------------------------------------------------------------------------
  # Hygiene, static half (fix wave 25, R-HYGIENE): over the whole tree, always — wall-clock upper bounds in tests
  # (L1), hard-coded test ports (L2), hand-written test counts in the docs (L3; counts live in the generated
  # docs/test-counts.md), and the shared files byte-identical across services (L4). The dynamic half runs inside
  # every test job above. `devtools/hygiene_check.py` is standard-library Python; nothing is installed.
  # ---------------------------------------------------------------------------------------------------------------
  hygiene-static:
    name: hygiene-static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # L3 accepts a count tied to a commit only if that commit resolves
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: pytest for the self-test's pytest-plugin cases (the services' pin)
        run: python -m pip install pytest==9.1.1
      - name: The checker's own self-test (every rule fails on a planted violation; the clean probe passes)
        run: python -B -m unittest devtools/test_hygiene_check.py -v
      - name: Docker builds pass every build argument their Dockerfile requires (pins = ADR 0011)
        run: python -B -m unittest devtools/test_ci_docker_args.py -v
      - name: Static rules L1-L4
        run: python devtools/hygiene_check.py lint --strict-allowlist
      - name: docs/test-counts.md is present and well-formed
        run: python devtools/hygiene_check.py counts --check

  # ---------------------------------------------------------------------------------------------------------------
  # The one check branch protection requires. A skipped upstream job (path filter said its inputs did not change)
  # is fine; a failed or cancelled one is not.
  # ---------------------------------------------------------------------------------------------------------------
  required:
    name: required
    if: always()
    needs:
      - changes
      - python-tests
      - delivery-py
      - ledger-rust
      - orchestrator-go
      - dashboard-ts
      - live-runs
      - delivery-docker-live
      - audit-python
      - audit-rust
      - audit-node
      - secret-scan
      - hygiene-static
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was skipped by the path filter
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os
          needs = json.loads(os.environ["RESULTS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          for k, v in sorted(needs.items()):
              print(f"{k:24s} {v['result']}")
          if needs["changes"]["result"] != "success":
              raise SystemExit("the changes job did not succeed; nothing downstream is trustworthy")
          if bad:
              raise SystemExit(f"failed or cancelled: {bad}")
          print("all required jobs passed")
          EOF
