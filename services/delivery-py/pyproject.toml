[project]
name = "zbm-delivery"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "deerflow-harness",
  "deerflow-extension-api",
  "fastapi==0.141.1", "pydantic==2.13.3", "uvicorn[standard]==0.46.0", "httpx==0.28.1",
]
[tool.uv.sources]
deerflow-harness = { git = "https://github.com/bytedance/deer-flow.git", rev = "345f08be00c8a9495079b732a39b46aa9af1584e", subdirectory = "backend/packages/harness" }
deerflow-extension-api = { git = "https://github.com/bytedance/deer-flow.git", rev = "345f08be00c8a9495079b732a39b46aa9af1584e", subdirectory = "backend/packages/extension-api" }
[tool.uv]
override-dependencies = [
  "langchain-openviking ; sys_platform == 'never'",
  "openviking-sdk ; sys_platform == 'never'",
  "langgraph-api ; sys_platform == 'never'",
  "langgraph-runtime-inmem ; sys_platform == 'never'",
  "langgraph-cli ; sys_platform == 'never'",
  "websockets==16.0",
  "langgraph==1.2.9", "langchain==1.3.14", "langchain-core==1.4.9", "langgraph-checkpoint==4.1.1", "langgraph-prebuilt==1.1.0",
  "langchain-anthropic==1.4.6", "langchain-openai==1.2.1", "langchain-google-genai==4.2.2", "langchain-deepseek==1.0.1", "langchain-mcp-adapters==0.2.2",
  "anyio>=4.14.2", "soupsieve>=2.9.0",
]
[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.ruff]
line-length = 130
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008", "B904", "E731", "I001"]
