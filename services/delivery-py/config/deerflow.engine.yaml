# deer-flow harness configuration for the ZBM fix engine (DEPT28_SPEC 0.4(b), C.1.3). SHA-256 pinned in
# src/zbm_delivery/config.py (PINNED_DEERFLOW_CONFIG_SHA256); the gate refuses to start when this file differs from
# the pin, and refuses independently when any key below is not what the spec requires (test G10). Every seam here
# is OUR class: the sandbox provider, the guardrail provider and the model class are zbm_delivery adapters.
config_version: 45
log_level: warning
logging:
  enhance:
    enabled: false
    format: text

token_usage:
  enabled: true
token_budget:
  enabled: true
  max_tokens: 2000000
  warn_threshold: 0.8
  hard_stop_threshold: 1.0

# D3: recursion limit 200 (the gate refuses anything above DLV_RECURSION_LIMIT).
recursion_limit: 200
max_recursion_limit: 200

# D5: exactly one model, reached only through our EgressChatModel (no provider SDK client exists in this process).
models:
  - name: engine
    display_name: ZBM fix engine model (egress adapter)
    use: zbm_delivery.adapters.model:EgressChatModel
    model: engine
    supports_thinking: false
    supports_vision: false

# Tool set (0.4(b)): the sandbox group only. No web_search, web_fetch, image_search, browser, MCP, ACP.
tool_groups:
  - name: file:read
  - name: file:write
  - name: bash
tools:
  - name: ls
    group: "file:read"
    use: "deerflow.sandbox.tools:ls_tool"
  - name: read_file
    group: "file:read"
    use: "deerflow.sandbox.tools:read_file_tool"
  - name: glob
    group: "file:read"
    use: "deerflow.sandbox.tools:glob_tool"
  - name: grep
    group: "file:read"
    use: "deerflow.sandbox.tools:grep_tool"
  - name: write_file
    group: "file:write"
    use: "deerflow.sandbox.tools:write_file_tool"
  - name: str_replace
    group: "file:write"
    use: "deerflow.sandbox.tools:str_replace_tool"
  - name: bash
    group: bash
    use: "deerflow.sandbox.tools:bash_tool"

# D2 / C.2: Docker only, our provider class; never LocalSandboxProvider, never host bash. The image reference is
# DLV_SANDBOX_IMAGE (deer-flow substitutes $NAME from the environment at load: config/app_config.py
# resolve_env_variables); the gate checks the resolved value is digest-pinned on DLV_IMAGE_REGISTRY. DF's own
# network proxy sidecar (sandbox.network.*) is not used: our network policy is Docker-level (--network <internal>).
sandbox:
  use: zbm_delivery.adapters.sandbox:ZbmDockerSandboxProvider
  allow_host_bash: false
  image: $DLV_SANDBOX_IMAGE
  bash_command_timeout: 600
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

# F-03: every tool call is decided by our provider, record-first; fail_closed so an exception is a deny in DF too.
guardrails:
  enabled: true
  fail_closed: true
  provider:
    use: zbm_delivery.adapters.guardrail:ZbmGuardrailProvider
    config: {}

# D11 / C.6: memory off for every engine run; the noop manager; nothing injected.
memory:
  enabled: false
  injection_enabled: false
  manager_class: noop

# F-12: the agent never edits its own skills.
skill_evolution:
  enabled: false

# 0.4(c): our (empty) skills root (the service exports DLV_SKILLS_ROOT = the absolute path of services/delivery-py/skills
# before the harness loads this file); DEER_FLOW_SKILLS_PATH must be unset or equal to it.
skills:
  path: $DLV_SKILLS_ROOT
  container_path: /mnt/skills

# receipts on: tool receipts are part of the evidence chain (verification_config.py:11)
verification:
  receipts_enabled: true

# D3: per-subagent limits (the gate refuses values above DLV_SUBAGENT_TIMEOUT_S / DLV_SUBAGENT_MAX_TURNS).
subagents:
  timeout_seconds: 900
  max_turns: 50
  max_total_per_run: 8

# Nothing else: no acp_agents, no plugins, no extensions.mcp_servers (the gate refuses them when present).
acp_agents: {}
plugins: []
