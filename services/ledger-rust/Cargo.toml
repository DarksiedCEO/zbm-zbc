[package]
name = "ledger-rust"
version = "0.1.0"
edition = "2021"
description = "ZBM Revenue Recovery — tamper-evident evidence ledger (hash-chained append-only log)"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
# fix wave 22 (G7): O_NOFOLLOW and the SIGTERM/SIGINT handler that removes LEDGER_PORT_FILE. Already in the
# build (tokio/mio depend on it, same version in Cargo.lock); tokio's own "signal" feature would add
# signal-hook-registry, which this offline build does not carry.
libc = "0.2"
