# gitleaks configuration for zbm-zbc (used by the `secret-scan` job in .github/workflows/ci.yml).
# Extends the default ruleset. The allowlist below is deliberately narrow: exact strings only, no file or
# path exemptions, so a real secret added to any file (including these tests) is still caught.
title = "zbm-zbc"

[extend]
useDefault = true

[[allowlists]]
description = "Deliberately fake secret shapes used by onboarding-py's redaction/attack tests (test_cert_attack.py, test_fix_wave1.py): two fake AWS-key shapes, a fake high-entropy token and a fake cued password. Exact strings, matched against the detected secret."
regexTarget = "secret"
regexes = [
  '''^AKIAQWERTYUIOPASDFGH$''',
  '''^AKIAABCDEFGHIJKLMNOP$''',
  '''^FAKEsecret9Zq7Hunter2Xy81Lp$''',
  '''^tangerine-walrus-42$''',
]

[[allowlists]]
description = "Deliberately fake Stripe test-key shapes used by finance-py's simulated Stripe (tests/stripe_sim.py) and its live run (devtools/live_run.py); invented, not issued by Stripe. Exact strings, matched against the detected secret."
regexTarget = "secret"
regexes = [
  '''^sk_test_51FinanceSimulatedKey000000000000$''',
  '''^sk_test_51LiveRunSimulatedKey0000000000$''',
]

# Test-only key: the fixed PII hash key sales-py's tests used (services/sales-py/tests/helpers.py:29, PII_KEY_HEX),
# first committed in ee0703a. It was never a production key; it was replaced in 6072160 by a key the tests derive at
# import time, so it now exists only in history. Exact string, matched against the detected secret.
[[allowlists]]
description = "Retired test-only PII hash key from sales-py's tests (tests/helpers.py PII_KEY_HEX in history; replaced in 6072160). Exact string, matched against the detected secret."
regexTarget = "secret"
regexes = [
  '''^3f9c2a7e51d04b86c8e1f7a2093d5b6e4a1c8f0d72e9b35a6c4d1e8f0b7a2c93$''',
]
